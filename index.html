<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Servicio Suspendido</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #0f172a;
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .card {
            max-width: 420px;
            width: 100%;
            text-align: center;
        }
        .icon-wrap {
            width: 88px;
            height: 88px;
            margin: 0 auto 24px;
            background: #1e293b;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 40px;
        }
        h1 {
            font-size: 1.4rem;
            font-weight: 700;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        p.sub {
            color: #94a3b8;
            font-size: 0.95rem;
            line-height: 1.6;
            margin-bottom: 28px;
        }
        .btn-contacto {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: #10b981;
            color: #0f172a;
            text-decoration: none;
            font-weight: 700;
            padding: 14px 28px;
            border-radius: 10px;
            font-size: 0.95rem;
        }
        .btn-contacto:active { opacity: 0.85; }
        .footer {
            margin-top: 40px;
            color: #475569;
            font-size: 0.72rem;
            letter-spacing: 0.3px;
        }
        .footer b { color: #64748b; }
    </style>
</head>
<body>
    <div class="card">
        <div class="icon-wrap">🔒</div>
        <h1>Servicio suspendido<br>por falta de pago </h1>
        <p class="sub">Contacta a GAM SISTEMAS INTELIGENTES para reactivar tu acceso a PEDCOR.</p>

        <!-- ✏️ EDITA AQUÍ: cambia el número por el de contacto real (formato: código país + número, sin espacios ni signos) -->
        <a class="btn-contacto" href="https://wa.me/3339019091?text=Hola%2C%20quiero%20reactivar%20mi%20servicio%20de%20PEDCOR" target="_blank" rel="noopener">
            💬 Contactar por WhatsApp
        </a>

        <div class="footer">PEDCOR — desarrollado por <b>GAM SISTEMAS INTELIGENTES</b></div>
    </div>
</body>
</html>
